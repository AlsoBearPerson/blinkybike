[package]
name = "blinkybike"
version = "0.1.0"
edition = "2024"

publish = false

[[bin]]
name = "blinkybike"
test = false
doctest = false
bench = false

[dependencies]
cortex-m = { version = "0.7.9", features = ["inline-asm"] }
cortex-m-rt = "0.7.6"
critical-section = "1.2.0"
defmt = "1.1.1"
defmt-rtt = { version = "1.3.0", features = ["disable-blocking-mode"] }
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "time-driver", "critical-section-impl", "rp235xa", "binary-info", "executor-thread"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
fixed = "1.31.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
smart-leds = "0.4.0"
static_cell = "2.1.1"

color-parse = { version = "0.1.0", path = "color-parse/" }

[profile.release]
# Since we don't actually ship the full ELF to the target device,
# no harm in keeping debug symbols around, defmt wants them.
debug = true
